[project]
name = "bokasher"
version = "0.1.0"
description = "動画の顔を自動でボカすデスクトップアプリ"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26,<2",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9,<5",
    "pillow>=10.2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pyinstaller>=6.10",
    "pytest>=8.0",
]

[project.scripts]
bokasher = "bokasher.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
